<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>

  <!-- Monospace (terminal, code, etc.) -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Hurmit Nerd Font Mono</family>
      <family>Noto Sans Mono</family>
      <family>Noto Sans Symbols 2</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <!-- Sans (GTK UI) -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans</family>
      <family>Hurmit Nerd Font</family>
      <family>Noto Sans Symbols 2</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <!-- Serif -->
  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

</fontconfig>
